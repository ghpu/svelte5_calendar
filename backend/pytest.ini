[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts =
    --verbose
    --color=yes
    --strict-markers
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-exclude-lines="pragma: no cover"

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning

markers =
    integration: Integration tests
    unit: Unit tests
